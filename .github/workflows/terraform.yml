name: 'Terraform'

on:
  push:
    branches: [ "CICD_terraform" ]
  pull_request:
    branches: [ "CICD_terraform" ]

jobs:
  deploy:
    env:
      AWS_ACCESS_KEY_ID: "${{}}"
      AWS_SECRET_ACCESS_KEY: "${{}}"
      AWS_SECRET_TOKEN: "${{}}"
      
    name: 'Terraform'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Terraform Init
      run: terraform init
      
    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Plan
      run: terraform plan -input=false

    - name: Terraform Apply
      run: terraform apply -auto-approve -input=false
